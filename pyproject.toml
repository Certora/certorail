[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certorail"
version = "0.1.0"
description = "CertorAIl"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [
    {name = "Certora Ltd."}
]

dependencies = ["typing-extensions", "pyright", "pydantic", "textual"]

# `uv tool install .` puts `certorail` on the PATH: analyse, check against the default
# policy, and run --  `certorail program.py [--root DIR] [--check] [-- ARG ...]`
[project.scripts]
certorail = "certorail.host:main"
certorail-explore = "certorail.explorer:main"

[tool.setuptools.packages.find]
include = ["certorail*"]


[tool.pyright]
enableExperimentalFeatures=true
reportUnnecessaryComparison = "error"
reportMatchNotExhaustive = "error"
