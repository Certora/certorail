[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certorail"
version = "0.1.0"
description = "CertorAIl"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Certora Ltd."}
]

dependencies = ["typing-extensions", "pyright", "pydantic", "textual"]

# `uv run pytest` must find pytest in the project environment: without it uv falls back to a
# pytest on PATH under whatever interpreter owns it, and the suite silently tests that
# interpreter's site-packages instead of this venv's
[dependency-groups]
dev = ["pytest"]

# `uv tool install .` puts `certorail` on the PATH: `certorail run|check|describe|explore|init|
# policy|view …`. `certorail-run [--check] (-c SOURCE | FILE) [-- ARG ...]` is the agent's entry
# point: the ambient policy only, always jailed -- no --policy/--root/--no-jail exists, so a
# shell allow-rule on its prefix admits nothing but a program and its arguments
[project.scripts]
certorail = "certorail.host:main"
certorail-run = "certorail.host:run_main"

[tool.setuptools.packages.find]
include = ["certorail*"]

# package data read through importlib.resources, so it ships in the wheel: the program-author
# guide the session hook injects (certorail/SUBSET_PROMPT.md), the ruleset packs
# `certorail policy install NAME` installs by name (certorail/rulesets/<name>/), and the Claude
# Code plugin as a marketplace directory (certorail/plugin/), which `certorail init` registers
# from the installed package -- loaded in place, so upgrading the tool upgrades the plugin
[tool.setuptools.package-data]
certorail = [
    "SUBSET_PROMPT.md",
    "rulesets/*/*.toml", "rulesets/*/*.md",
    "plugin/.claude-plugin/*.json",
    "plugin/plugins/certorail/.claude-plugin/*.json",
    "plugin/plugins/certorail/hooks/*",
    "plugin/plugins/certorail/skills/certorail-policy/*.md",
]


[tool.pyright]
enableExperimentalFeatures=true
reportUnnecessaryComparison = "error"
reportMatchNotExhaustive = "error"
